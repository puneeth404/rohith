services:
  web:
    build: .
    ports:
      - "8502:8501"
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./models:/app/models
      - ./reports_history.db:/app/reports_history.db
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LOG_LEVEL=INFO
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped
